<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c58">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳">
<title>記帳</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17262a;--mute:#66777a;--line:#dbe3df;--acc:#0f5c58;--onacc:#fff;--exp:#b5472d;--inc:#2b7a4b;--tr:#3a5a99;--warn:#fff1d6}
@media(prefers-color-scheme:dark){:root{--bg:#101a1b;--card:#18272a;--ink:#e6efed;--mute:#93a6a8;--line:#2a3d40;--acc:#5fc2b8;--onacc:#06201e;--exp:#ef8f74;--inc:#6fcf94;--tr:#8fb0f0;--warn:#3a3118}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h2{font-size:20px;margin:4px 0 14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 0}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.big{font-size:40px;font-weight:700;text-align:right;border:0;border-bottom:2px solid var(--acc);border-radius:0;background:transparent;padding:6px 2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:17px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--mute);padding:8px 0;text-decoration:underline}
nav{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:14px 0;font-weight:600;color:var(--mute)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item small,.sub{color:var(--mute);font-size:13px}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.e{color:var(--exp)}.i{color:var(--inc)}.t{color:var(--tr)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.warn{background:var(--warn);border-color:transparent;font-size:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.sum b{display:block;font-size:18px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}.bar.over i{background:var(--exp)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://ghkxtkpfitcecdcvqwxr.supabase.co';
const SB_KEY='sb_publishable_sytoYT8OqueRTeT40VQbXg_aKVIB2zY';
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2=(v,d=0)=>Number(v||0).toLocaleString('zh-TW',{maximumFractionDigits:d});
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const num=x=>parseFloat(String(x??'').replace(/,/g,''));
const isNet=m=>!navigator.onLine||/fetch|network|load failed/i.test(m||'');
const S={tab:'add',type:'支',acc:[],items:[],trips:[],pend:ls('pend')||[],month:today().slice(0,7),date:today()};
const nm=(arr,id)=>arr.find(x=>x.id==id)?.name||id||'';
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',3500)}

async function master(){
  const r=await Promise.all([
    sb.from('accounts').select('*').order('sort_order'),
    sb.from('items').select('*').order('sort_order'),
    sb.from('trips').select('*').order('name')]);
  if(r.some(x=>x.error)){const c=ls('master');if(c)Object.assign(S,c);return}
  S.acc=r[0].data;S.items=r[1].data;S.trips=r[2].data;
  ls('master',{acc:S.acc,items:S.items,trips:S.trips});
}
async function send(row){
  try{
    const {error}=await sb.from('transactions').upsert(row,{onConflict:'id',ignoreDuplicates:true});
    return error?{message:error.message}:null;
  }catch(e){return {message:String(e)}}
}
async function flush(){
  if(!S.pend.length||!navigator.onLine)return;
  const keep=[];
  for(const p of S.pend){const e=await send(p.row);if(e)keep.push({row:p.row,err:isNet(e.message)?p.err:e.message})}
  const n=S.pend.length-keep.length;
  S.pend=keep;ls('pend',keep);
  if(n)toast(`已送出 ${n} 筆暫存的記錄`);
  if(S.tab=='list')vList();
}

function login(msg){
  $('#app').innerHTML=`<main><h2>記帳</h2><label>Email<input id=em type=email autocomplete=username></label>
  <label>密碼<input id=pw type=password autocomplete=current-password></label>
  <button class=btn data-act=login>登入</button><p class=sub id=lm>${esc(msg||'')}</p></main>`;
}
function render(){
  if(!S.user)return login();
  const tabs=[['add','記帳'],['list','明細'],['bal','帳戶'],['mon','月報']];
  $('#app').innerHTML=`<main id=v></main><nav>${tabs.map(([k,l])=>`<button data-act=tab data-k=${k} class="${S.tab==k?'on':''}">${l}</button>`).join('')}</nav>`;
  ({add:vAdd,list:vList,bal:vBal,mon:vMon})[S.tab]();
}

function vAdd(){
  const t=S.type,A=S.acc.filter(a=>a.active),last=ls('last')||{};
  const opt=(arr,sel,f)=>arr.map(x=>`<option value="${esc(x.id)}"${x.id==sel?' selected':''}>${esc(f(x))}</option>`).join('');
  const accOpt=sel=>opt(A,sel,a=>`${a.name}（${a.currency}）`);
  const seg=['支','收','轉帳'].map(x=>`<button type=button data-act=type data-k="${x}" class="${x==t?'on':''}">${x}</button>`).join('');
  const body=t=='轉帳'
    ?`<label>轉出帳戶<select id=from>${accOpt(last.from)}</select></label>
      <label>轉入帳戶<select id=to>${accOpt(last.to)}</select></label>
      <div class=row><label>轉出金額<input id=fa inputmode=decimal></label><label>轉入金額<input id=ta inputmode=decimal></label></div>
      <p class=sub>同幣別轉帳，轉入金額會自動帶入；換匯請填實際收到的金額。</p>`
    :`<input id=amt class=big inputmode=decimal placeholder=0 aria-label=金額>
      <label>帳戶<select id=acc>${accOpt(last.acc)}</select></label>
      <label>項目<select id=item>${opt(S.items.filter(i=>i.active&&i.type==t),last['item'+t],i=>i.name)}</select></label>`;
  const fee=t=='收'?'':`<label>手續費（以扣款帳戶幣別計）<input id=fee inputmode=decimal placeholder=0></label>`;
  $('#v').innerHTML=`<h2>記一筆</h2><div class=seg>${seg}</div>${body}${fee}
  <label>旅遊<select id=trip><option value="">無</option>${opt(S.trips.filter(x=>x.active),'',x=>x.name)}</select></label>
  <label>日期<input id=date type=date value="${S.date}"></label>
  <label>備註<input id=note></label>
  <button class=btn data-act=save id=sv>儲存</button>`;
  const fa=$('#fa');if(fa)fa.oninput=()=>{const f=S.acc.find(a=>a.id==$('#from').value),o=S.acc.find(a=>a.id==$('#to').value);if(f&&o&&f.currency==o.currency)$('#ta').value=fa.value};
}
async function save(){
  const t=S.type,v=id=>$('#'+id)?.value;
  const row={id:crypto.randomUUID(),tx_date:v('date'),type:t,fee:num(v('fee'))||0,trip_id:v('trip')||null,note:(v('note')||'').trim()||null};
  const L=ls('last')||{};
  if(t=='轉帳'){
    Object.assign(row,{from_account_id:v('from'),to_account_id:v('to'),from_amount:num(v('fa')),to_amount:num(v('ta'))});
    L.from=row.from_account_id;L.to=row.to_account_id;
    if(!(row.from_amount>0&&row.to_amount>0))return toast('請填寫轉出與轉入金額');
  }else{
    Object.assign(row,{account_id:v('acc'),item_id:v('item'),amount:num(v('amt'))});
    L.acc=row.account_id;L['item'+t]=row.item_id;
    if(!(row.amount>0))return toast('請輸入金額');
  }
  ls('last',L);S.date=row.tx_date;
  $('#sv').disabled=true;
  const e=await send(row);
  if(!e)toast('已記錄');
  else if(isNet(e.message)){S.pend.push({row,err:'尚未送出'});ls('pend',S.pend);toast('目前沒有網路，已先存在手機，連線後會自動送出')}
  else{$('#sv').disabled=false;return toast('未儲存：'+e.message)}
  vAdd();
}

async function vList(){
  $('#v').innerHTML='<h2>明細</h2><p class=sub>載入中…</p>';
  const {data,error}=await sb.from('transactions').select('*').is('deleted_at',null)
    .order('tx_date',{ascending:false}).order('created_at',{ascending:false}).limit(80);
  const pend=S.pend.map((p,i)=>`<div class="box warn"><b>尚未送出</b>　${esc(p.row.tx_date)} ${esc(p.row.note||'')}<br>${esc(p.err)}<br>
    <button class=link data-act=pdel data-i=${i}>刪除這筆</button></div>`).join('');
  if(error)return $('#v').innerHTML=`<h2>明細</h2>${pend}<p>${esc(error.message)}</p>`;
  const rows=data.map(r=>{
    const tr=r.type=='轉帳',cls=tr?'t':r.type=='收'?'i':'e';
    const title=tr?`${nm(S.acc,r.from_account_id)} → ${nm(S.acc,r.to_account_id)}`:nm(S.items,r.item_id);
    const amt=tr?`${n2(r.from_amount,2)} ${r.currency}`:`${r.type=='收'?'+':'−'}${n2(r.amount,2)} ${r.currency}`;
    return `<div class=item data-act=del data-id="${r.id}"><div>${esc(title)}<br><small>${r.tx_date}${tr?'':'・'+esc(nm(S.acc,r.account_id))}${r.note?'・'+esc(r.note):''}</small></div>
      <div class="amt ${cls}">${amt}${r.fee>0?`<br><small>手續費 ${n2(r.fee,2)}</small>`:''}</div></div>`}).join('');
  $('#v').innerHTML=`<h2>明細</h2>${pend}${rows||'<p class=sub>還沒有記錄。到「記帳」新增第一筆。</p>'}<p class=sub>點一筆可刪除。</p>`;
}
async function delTx(id){
  if(!confirm('刪除這筆記錄？'))return;
  const {error}=await sb.from('transactions').update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(error)toast('刪除失敗：'+error.message);else{toast('已刪除');vList()}
}

async function vBal(){
  $('#v').innerHTML='<h2>帳戶</h2><p class=sub>載入中…</p>';
  const {data,error}=await sb.from('account_balances').select('*').eq('active',true).order('sort_order');
  if(error)return $('#v').innerHTML=`<h2>帳戶</h2><p>${esc(error.message)}</p>`;
  const assets=data.filter(a=>a.include_in_assets).reduce((s,a)=>s+Number(a.twd_value||0),0);
  const cards=data.filter(a=>a.kind=='信用卡').reduce((s,a)=>s-Number(a.twd_value||0),0);
  const hint=data.every(a=>Number(a.opening_balance)==0)?`<div class="box warn">期初餘額尚未設定，下方餘額只包含新系統內的記錄。</div>`:'';
  const miss=data.filter(a=>a.fx_rate_today==null).map(a=>a.currency);
  $('#v').innerHTML=`<h2>帳戶</h2>${hint}
  <div class=sum><div><small class=sub>資產（台幣）</small><b>${n2(assets)}</b></div><div><small class=sub>信用卡待繳</small><b class=e>${n2(cards)}</b></div><div><small class=sub>淨值</small><b>${n2(assets-cards)}</b></div></div>
  ${miss.length?`<div class="box warn">缺少 ${[...new Set(miss)].join('、')} 的匯率，該帳戶未計入台幣估值。</div>`:''}
  ${data.map(a=>`<div class=item style="cursor:default"><div>${esc(a.name)}<br><small>${esc(a.kind)}・${a.currency}</small></div>
  <div class="amt ${a.balance<0?'e':''}">${n2(a.balance,2)}${a.currency!='TWD'&&a.twd_value!=null?`<br><small>≈ ${n2(a.twd_value)} TWD</small>`:''}</div></div>`).join('')}`;
}

async function vMon(){
  const m=S.month,[y,mo]=m.split('-').map(Number),nx=mo==12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`;
  $('#v').innerHTML=`<h2>月報</h2><input type=month id=mm value="${m}"><p class=sub>載入中…</p>`;
  const [t,b]=await Promise.all([
    sb.from('transactions').select('type,twd_amount,fee_twd,items(group_name)').is('deleted_at',null).gte('tx_date',m+'-01').lt('tx_date',nx+'-01'),
    sb.from('budgets').select('*')]);
  if(t.error)return $('#v').innerHTML=`<h2>月報</h2><p>${esc(t.error.message)}</p>`;
  let inc=0,exp=0;const g={};
  t.data.forEach(r=>{
    if(r.type=='收')inc+=Number(r.twd_amount);
    if(r.type=='支'){exp+=Number(r.twd_amount);const k=r.items?.group_name||'未分類';g[k]=(g[k]||0)+Number(r.twd_amount)}
    if(Number(r.fee_twd)>0){exp+=Number(r.fee_twd);g['金融費用']=(g['金融費用']||0)+Number(r.fee_twd)}
  });
  const bud=Object.fromEntries((b.data||[]).map(x=>[x.group_name,Number(x.amount_twd)]));
  const keys=[...new Set([...Object.keys(g),...Object.keys(bud)])].sort((a,c)=>(g[c]||0)-(g[a]||0));
  $('#v').innerHTML=`<h2>月報</h2><input type=month id=mm value="${m}">
  <div class=sum style="margin-top:14px"><div><small class=sub>收入</small><b class=i>${n2(inc)}</b></div><div><small class=sub>支出</small><b class=e>${n2(exp)}</b></div><div><small class=sub>結餘</small><b>${n2(inc-exp)}</b></div></div>
  ${keys.map(k=>{const s=g[k]||0,bg=bud[k],p=bg?Math.min(100,s/bg*100):(exp?s/exp*100:0);
    return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span>${n2(s)}${bg?` / ${n2(bg)}`:''}</span></div><div class="bar${bg&&s>bg?' over':''}"><i style="width:${p}%"></i></div></div>`}).join('')||'<p class=sub>這個月還沒有記錄。</p>'}
  <p class=sub>台幣金額依交易當天或之前最近的匯率換算；轉帳不計入收支，手續費計入支出。</p>`;
}

const acts={
  async login(){
    $('#lm').textContent='登入中…';
    const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)return login('登入失敗：'+error.message);
    S.user=data.user;await master();flush();render();
  },
  tab(b){S.tab=b.dataset.k;render()},
  type(b){S.type=b.dataset.k;vAdd()},
  save,
  del(b){delTx(b.dataset.id)},
  pdel(b){S.pend.splice(+b.dataset.i,1);ls('pend',S.pend);vList()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)acts[b.dataset.act]?.(b)});
document.addEventListener('change',e=>{if(e.target.id=='mm'&&e.target.value){S.month=e.target.value;vMon()}});
addEventListener('online',flush);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user;
  if(S.user){await master();flush()}
  render();
})();
</script>
</body>
</html>
